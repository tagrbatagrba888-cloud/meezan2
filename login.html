  .setup-modal {

  .setup-title { font-size: 22px; font-weight: 800; color: var(--text-main); margin-bottom: 8px; }
  .setup-subtitle { font-size: 13.5px; color: var(--text-sub); line-height: 1.6; }

  .setup-warning {

  .setup-btn {

</style>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { 
  getFirestore, doc, onSnapshot, setDoc, serverTimestamp 
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAmkCOrSaklhUiDdDfZCpSDQNmMYP-Gdw0",
  authDomain: "qanon-c716d.firebaseapp.com",
  projectId: "qanon-c716d",
  storageBucket: "qanon-c716d.firebasestorage.app",
  messagingSenderId: "757756130875",
  appId: "1:757756130875:web:63c53534c6843e2a29ce1e",
  measurementId: "G-8FZGTC779Y"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const $ = (id) => document.getElementById(id);

// ============================================================
// 🧹 دالة التنظيف الشاملة
// ============================================================
function cleanInput(value) {
  if (typeof value !== 'string') return '';
  return value
    .replace(/[\u200B-\u200D\uFEFF]/g, '')
    .replace(/[\u00A0\u1680\u2000-\u200A\u2028\u2029\u202F\u205F\u3000]/g, ' ')
    .replace(/^\s+|\s+$/g, '')
    .trim();
}

// ============================================================
// 🔐 التشفير XOR + Base64
// ============================================================
const SECRET_KEY = 'MEEZAN_2026_SECRET_KEY_v1';

function xorEncrypt(text, key) {
  let result = '';
  for (let i = 0; i < text.length; i++) {
    result += String.fromCharCode(text.charCodeAt(i) ^ key.charCodeAt(i % key.length));
  }
  return result;
}

function encryptPassword(password) {
  try {
    const xorResult = xorEncrypt(password, SECRET_KEY);
    return btoa(unescape(encodeURIComponent(xorResult)));
  } catch (e) { return ''; }
}

// ============================================================
// 📅 حقوق النشر مع السنة التلقائية
// ============================================================
function buildCopyright(data) {
  const year = new Date().getFullYear();
  const nameAr = data.siteNameAr || 'ميزان';
  const nameEn = data.siteNameEn || 'MEEZAN';

  if (data.copyright) {
    const customText = data.copyright
      .replace(/©\s*\d{4}/g, `© ${year}`)
      .replace(/\b20\d{2}\b/g, year);
    return customText;
  }

  return `<strong>${nameAr} | ${nameEn}</strong> © ${year}`;
}

// ============================================================
// 🧹 تنظيف صامت عند مغادرة الحقل
// ============================================================
function silentClean(input) {
  const cleaned = cleanInput(input.value);
  if (input.value !== cleaned) input.value = cleaned;
}

usernameInput.addEventListener('blur', () => silentClean(usernameInput));
passwordInput.addEventListener('blur', () => silentClean(passwordInput));

[usernameInput, passwordInput].forEach(input => {
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      silentClean(input);
      loginForm.requestSubmit();
    }
  });
});

// ============================================================
// 🌙 الوضع الليلي / النهاري
// ============================================================
const savedTheme = localStorage.getItem('meezan_theme') || 'light';
document.documentElement.setAttribute('data-theme', savedTheme);
updateThemeIcon(savedTheme);

themeToggle.addEventListener('click', () => {
  const current = document.documentElement.getAttribute('data-theme');
  const next = current === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('meezan_theme', next);
  updateThemeIcon(next);
});

function updateThemeIcon(theme) {
  themeIcon.className = theme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
}

// ============================================================
// 📦 الكاش
// ============================================================
const CACHE_KEY = 'meezan_settings_cache';

function saveToCache(data) {
  try {
    localStorage.setItem(CACHE_KEY, JSON.stringify({ ...data, _cachedAt: Date.now() }));
  } catch (e) {}
}

function loadFromCache() {
  try {
    const raw = localStorage.getItem(CACHE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}

// ============================================================
// 🎨 تطبيق الإعدادات
// ============================================================
function applySettings(data) {
  if (!data) return;

  if (data.logoUrl) {
    const logoImg = $('logoImg');
    if (logoImg.src !== data.logoUrl) logoImg.src = data.logoUrl;
    const iconLink = document.querySelector('link[rel="icon"]');
    if (iconLink && iconLink.href !== data.logoUrl) iconLink.href = data.logoUrl;
  }

  if (data.siteNameAr) {
    $('siteNameAr').textContent = data.siteNameAr;
    const footerAr = $('footerNameAr');
    if (footerAr) footerAr.textContent = data.siteNameAr;
  }
  if (data.siteNameEn) {
    $('siteNameEn').textContent = data.siteNameEn;
    const footerEn = $('footerNameEn');
    if (footerEn) footerEn.textContent = data.siteNameEn;
  }

  const nameAr = data.siteNameAr || 'ميزان';
  const nameEn = data.siteNameEn || 'MEEZAN';
  const newTitle = `${nameAr} | ${nameEn} - تسجيل الدخول`;
  if (document.title !== newTitle) document.title = newTitle;

  if (data.tagline) $('tagline').textContent = data.tagline;
  if (data.formSubtitle) $('formSubtitle').textContent = data.formSubtitle;

  const copyrightEl = $('copyrightText');
  copyrightEl.innerHTML = buildCopyright(data);

  applyColors(data);

  if (data.registrationOpen === false) {
    loginBtn.disabled = true;
    btnText.textContent = 'التسجيل مغلق حالياً';
    loginIcon.className = 'fas fa-lock';
    showError('عذراً، تسجيل الدخول مغلق حالياً من قبل الإدارة');
  }
}

function applyColors(data) {
  const currentTheme = document.documentElement.getAttribute('data-theme') || 'light';
  const rootStyle = document.documentElement.style;

  rootStyle.removeProperty('--primary');
  rootStyle.removeProperty('--accent');

  if (currentTheme === 'light' && data.lightColorsEnabled === true) {
    if (data.lightPrimary && /^#[0-9A-Fa-f]{6}$/.test(data.lightPrimary)) rootStyle.setProperty('--primary', data.lightPrimary);
    if (data.lightAccent && /^#[0-9A-Fa-f]{6}$/.test(data.lightAccent)) rootStyle.setProperty('--accent', data.lightAccent);
  } else if (currentTheme === 'dark' && data.darkColorsEnabled === true) {
    if (data.darkPrimary && /^#[0-9A-Fa-f]{6}$/.test(data.darkPrimary)) rootStyle.setProperty('--primary', data.darkPrimary);
    if (data.darkAccent && /^#[0-9A-Fa-f]{6}$/.test(data.darkAccent)) rootStyle.setProperty('--accent', data.darkAccent);
  }
}

function showError(msg) {
  errorText.textContent = msg;
  errorMsg.classList.add('show');
  successMsg.classList.remove('show');
}

function hideMessages() {
  errorMsg.classList.remove('show');
  successMsg.classList.remove('show');
}

function showSetupError(msg) {
  setupError.textContent = msg;
  setupError.classList.add('show');
}

// ============================================================
// 1️⃣ الكاش أولاً
// ============================================================
let currentSettings = null;
const cached = loadFromCache();
if (cached) {
  currentSettings = cached;
  applySettings(cached);
}
requestAnimationFrame(() => document.body.classList.add('ready'));

window.addEventListener('load', () => {
  usernameInput.value = '';
  passwordInput.value = '';
});

// ============================================================
// 2️⃣ Real-time settings
// ============================================================
onSnapshot(doc(db, 'settings', 'login'), (snap) => {
  if (!snap.exists()) return;
  const data = snap.data();
  currentSettings = data;
  applySettings(data);
  saveToCache(data);
}, (err) => console.log('settings cache fallback:', err.message));

new MutationObserver(() => {
  if (currentSettings) {
    applyColors(currentSettings);
    const copyrightEl = $('copyrightText');
    if (copyrightEl) copyrightEl.innerHTML = buildCopyright(currentSettings);
  }
}).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

setInterval(() => {
  if (currentSettings) {
    const copyrightEl = $('copyrightText');
    if (copyrightEl) copyrightEl.innerHTML = buildCopyright(currentSettings);
  }
}, 3600000);

// ============================================================
// 3️⃣ عرض كلمة السر
// ============================================================
togglePassword.addEventListener('click', () => {
  const isPwd = passwordInput.type === 'password';
  passwordInput.type = isPwd ? 'text' : 'password';
  eyeIcon.className = isPwd ? 'fas fa-eye-slash' : 'fas fa-eye';
});

toggleNewPassword.addEventListener('click', () => {
  const isPwd = newPassword.type === 'password';
  newPassword.type = isPwd ? 'text' : 'password';
  newEyeIcon.className = isPwd ? 'fas fa-eye-slash' : 'fas fa-eye';
});

// ============================================================
// 4️⃣ تسجيل الدخول — يقرأ من admins[] + الجذر
// ============================================================
let adminData = null;

onSnapshot(doc(db, 'admin', 'main'), (snap) => {
  if (!snap.exists()) {
    adminData = null;
    return;
  }
  const data = snap.data();
  adminData = {
    username: data.username || '',
    passwordEncrypted: data.passwordEncrypted || '',
    isFirstTime: data.isFirstTime === true,
    admins: Array.isArray(data.admins) ? data.admins : []
  };
}, (err) => console.log('admin data error:', err.message));

function waitForAdminData() {
  return new Promise((resolve) => {
    if (adminData) return resolve(adminData);
    const interval = setInterval(() => {
      if (adminData !== null) {
        clearInterval(interval);
        resolve(adminData);
      }
    }, 100);
    setTimeout(() => { clearInterval(interval); resolve(adminData); }, 3000);
  });
}

loginForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  hideMessages();

  // 🧹 تنظيف صامت
  const username = cleanInput(usernameInput.value);
  const password = cleanInput(passwordInput.value);

  usernameInput.value = username;
  passwordInput.value = password;

  if (!username || !password) {
    showError('الرجاء إدخال اسم المستخدم وكلمة السر');
    return;
  }

  loginBtn.disabled = true;
  spinner.classList.add('show');
  loginIcon.style.display = 'none';
  btnText.textContent = 'جاري التحقق...';

  try {
    const admin = await waitForAdminData();

    if (!admin) throw new Error('لم يتم العثور على بيانات المستخدم');

    // 🔍 1) ابحث في مصفوفة admins أولاً
    const foundUser = (admin.admins || []).find(
      u => cleanInput(u.username).toLowerCase() === username.toLowerCase()
    );

    // 🔍 2) لو ما وجد → جرّب الجذر (للأدمن الأساسي)
    let matchedUser = null;

    if (foundUser) {
      matchedUser = {
        username: foundUser.username,
        passwordEncrypted: foundUser.passwordEncrypted,
        isMain: foundUser.isMain === true
      };
    } else if (cleanInput(admin.username).toLowerCase() === username.toLowerCase()) {
      matchedUser = {
        username: admin.username,
        passwordEncrypted: admin.passwordEncrypted,
        isMain: true
      };
    }

    // ❌ لم يُوجد المستخدم
    if (!matchedUser) throw new Error('اسم المستخدم غير صحيح');

    // 🔐 3) تحقق من كلمة السر
    const encryptedInput = encryptPassword(password);
    if (encryptedInput !== matchedUser.passwordEncrypted) {
      throw new Error('كلمة السر غير صحيحة');
    }

    // ✅ 4) هل يحتاج نافذة "غيّر بياناتك"؟
    const isMainAdmin = matchedUser.isMain === true;
    const needsFirstTimeSetup = isMainAdmin && admin.isFirstTime === true;

    // ✅ نجح الدخول
    spinner.classList.remove('show');
    loginIcon.style.display = '';
    btnText.textContent = 'تسجيل الدخول';
    loginBtn.disabled = false;

    // 🧹 تنظيف الحقول
    usernameInput.value = '';
    passwordInput.value = '';

    sessionStorage.setItem('meezan_logged_in', 'true');
    sessionStorage.setItem('meezan_username', username);

    if (needsFirstTimeSetup) {
      setupOverlay.classList.add('show');
      newUsername.value = username;
      return;
    }

    successMsg.classList.add('show');
    setTimeout(() => window.location.replace('index.html'), 500);

  } catch (err) {
    spinner.classList.remove('show');
    loginIcon.style.display = '';
    btnText.textContent = 'تسجيل الدخول';
    loginBtn.disabled = false;

    passwordInput.value = '';
    passwordInput.focus();

    showError(err.message || 'حدث خطأ، حاول مرة أخرى');
  }
});

// ============================================================
// 5️⃣ حفظ البيانات الجديدة (نافذة أول مرة)
// ============================================================
setupSaveBtn.addEventListener('click', async () => {
  setupError.classList.remove('show');

  const newUser = cleanInput(newUsername.value);
  const newPass = cleanInput(newPassword.value);
  const confirmPass = cleanInput(confirmPassword.value);

  newUsername.value = newUser;
  newPassword.value = newPass;
  confirmPassword.value = confirmPass;

  if (!newUser || newUser.length < 3) return showSetupError('اسم المستخدم يجب أن يكون 3 أحرف على الأقل');
  if (!newPass || newPass.length < 6) return showSetupError('كلمة السر يجب أن تكون 6 أحرف على الأقل');
  if (newPass !== confirmPass) return showSetupError('كلمتا السر غير متطابقتين');
  if (newPass === '123456') return showSetupError('لا يمكن استخدام كلمة السر الافتراضية');

  setupSaveBtn.disabled = true;
  setupSaveBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري الحفظ...';

  try {
    const encryptedPassword = encryptPassword(newPass);

    // ✅ 1) جهّز البيانات للجذر
    const updateData = {
      username: newUser,
      passwordEncrypted: encryptedPassword,
      isFirstTime: false,
      updatedAt: serverTimestamp()
    };

    // ✅ 2) حدّث مصفوفة admins
    const adminsArray = Array.isArray(adminData?.admins) ? [...adminData.admins] : [];

    if (adminsArray.length === 0) {
      adminsArray.push({
        id: 'admin_main_' + Date.now(),
        username: newUser,
        passwordEncrypted: encryptedPassword,
        isMain: true,
        createdAt: new Date().toISOString()
      });
    } else {
      const mainIdx = adminsArray.findIndex(a => a.isMain === true);
      if (mainIdx !== -1) {
        adminsArray[mainIdx].username = newUser;
        adminsArray[mainIdx].passwordEncrypted = encryptedPassword;
        adminsArray[mainIdx].updatedAt = new Date().toISOString();
      } else {
        adminsArray.unshift({
          id: 'admin_main_' + Date.now(),
          username: newUser,
          passwordEncrypted: encryptedPassword,
          isMain: true,
          createdAt: new Date().toISOString()
        });
      }
    }

    updateData.admins = adminsArray;

    // ✅ 3) احفظ
    await setDoc(doc(db, 'admin', 'main'), updateData, { merge: true });

    localStorage.setItem('meezan_admin_username', newUser);

    newUsername.value = '';
    newPassword.value = '';
    confirmPassword.value = '';

    setupOverlay.classList.remove('show');
    successMsg.classList.add('show');
    setTimeout(() => window.location.replace('index.html'), 700);

  } catch (err) {
    console.error(err);
    showSetupError('حدث خطأ أثناء الحفظ: ' + err.message);
    setupSaveBtn.disabled = false;
    setupSaveBtn.innerHTML = '<i class="fas fa-check"></i> تأكيد التغيير والدخول';
  }
});

// ============================================================
// 6️⃣ توجيه تلقائي
// ============================================================
setTimeout(() => {
  if (sessionStorage.getItem('meezan_logged_in') === 'true') {
    if (adminData && adminData.isFirstTime === false) {
      window.location.replace('index.html');
    }
  }
}, 1500);

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
