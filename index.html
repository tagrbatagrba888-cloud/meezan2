<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0B3D2E">
<title>ميزان | MEEZAN - الرئيسية</title>
<link rel="icon" type="image/png" href="https://i.ibb.co/ymXPqr46/file-00000000af0c820aa687a3c3181a6a24.png">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --primary: #0B3D2E;
    --primary-light: #145A43;
    --primary-lighter: #1E7A5A;
    --accent: #C9A961;
    --accent-light: #E0C888;
    --bg-page: #F5F1E8;
    --bg-card: #FFFFFF;
    --bg-input: #F8FBF9;
    --text-main: #0B3D2E;
    --text-sub: #5A6B66;
    --border: #E0E5E1;
    --shadow: rgba(11, 61, 46, 0.15);
    --error: #C0392B;
    --success: #1E7A5A;
  }

  [data-theme="dark"] {
    --primary: #C9A961;
    --primary-light: #E0C888;
    --primary-lighter: #F0DBA8;
    --accent: #0B3D2E;
    --accent-light: #145A43;
    --bg-page: #0A1612;
    --bg-card: #11201B;
    --bg-input: #1A2C25;
    --text-main: #F5F1E8;
    --text-sub: #9BAEA6;
    --border: #1E3A31;
    --shadow: rgba(0, 0, 0, 0.5);
    --error: #E74C3C;
    --success: #2ECC71;
  }

  html, body {
    height: 100%;
    font-family: 'Cairo', sans-serif;
    overflow-x: hidden;
  }

  body {
    background: var(--bg-page);
    min-height: 100vh;
    min-height: 100dvh;
    color: var(--text-main);
    opacity: 0;
    transition: opacity 0.3s ease, background 0.4s ease;
  }

  body.ready { opacity: 1; }

  /* ============================================================
     شريط التنقل العلوي
     ============================================================ */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 100;
    background: var(--bg-card);
    border-bottom: 1px solid var(--border);
    box-shadow: 0 4px 20px var(--shadow);
    transition: background 0.4s ease, border-color 0.4s ease;
  }

  .topbar-inner {
    max-width: 1200px;
    margin: 0 auto;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }

  .topbar-brand {
    display: flex;
    align-items: center;
    gap: 14px;
    min-width: 0;
    flex: 1;
  }

  .topbar-logo {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    object-fit: contain;
    border: 2px solid var(--accent);
    background: var(--bg-input);
    padding: 3px;
    flex-shrink: 0;
  }

  .topbar-title {
    font-size: 20px;
    font-weight: 900;
    color: var(--primary);
    display: flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  [data-theme="dark"] .topbar-title { color: var(--accent); }

  .topbar-title .divider {
    color: var(--accent);
    font-weight: 300;
    opacity: 0.7;
  }

  .topbar-title .en {
    color: var(--text-sub);
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 2px;
  }

  [data-theme="dark"] .topbar-title .en { color: var(--accent-light); }

  .topbar-actions {
    display: flex;
    gap: 8px;
    flex-shrink: 0;
  }

  .icon-btn {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    background: var(--bg-input);
    border: 2px solid var(--border);
    color: var(--primary);
    font-size: 17px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.25s ease;
    text-decoration: none;
    flex-shrink: 0;
  }

  .icon-btn:hover {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
    transform: translateY(-2px);
  }

  [data-theme="dark"] .icon-btn:hover {
    color: var(--bg-page);
  }

  .icon-btn.logout {
    color: var(--error);
    border-color: rgba(192, 57, 43, 0.3);
  }

  .icon-btn.logout:hover {
    background: var(--error);
    color: #fff;
    border-color: var(--error);
  }

  /* زر القائمة (موبايل فقط) */
  .mobile-menu-btn {
    display: none;
    width: 42px;
    height: 42px;
    border-radius: 12px;
    background: var(--bg-input);
    border: 2px solid var(--border);
    color: var(--primary);
    font-size: 18px;
    cursor: pointer;
    align-items: center;
    justify-content: center;
    transition: all 0.25s ease;
    flex-shrink: 0;
  }

  .mobile-menu-btn:hover,
  .mobile-menu-btn:active {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
  }

  /* ============================================================
     منطقة الترحيب
     ============================================================ */
  .welcome-banner {
    max-width: 1200px;
    margin: 24px auto 0;
    padding: 0 20px;
  }

  .welcome-card {
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 60%, var(--primary-lighter) 100%);
    border-radius: 22px;
    padding: 28px 32px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 15px 40px var(--shadow);
    border: 3px solid var(--accent);
  }

  .welcome-card::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image: 
      radial-gradient(circle at 90% 20%, rgba(201, 169, 97, 0.2) 0%, transparent 40%),
      radial-gradient(circle at 10% 80%, rgba(201, 169, 97, 0.15) 0%, transparent 40%);
    pointer-events: none;
  }

  .welcome-content {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    flex-wrap: wrap;
  }

  .welcome-text-side { flex: 1; min-width: 220px; }

  .welcome-title {
    font-size: 24px;
    font-weight: 900;
    color: #fff;
    margin-bottom: 6px;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
  }

  .welcome-subtitle {
    font-size: 14px;
    color: rgba(255, 255, 255, 0.85);
    font-weight: 500;
  }

  .welcome-icon {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.15);
    border: 2px solid var(--accent);
    color: var(--accent);
    font-size: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    animation: floatIcon 3s ease-in-out infinite;
  }

  @keyframes floatIcon {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }

  /* ============================================================
     شبكة الأزرار
     ============================================================ */
  .buttons-section {
    max-width: 1200px;
    margin: 32px auto 40px;
    padding: 0 20px;
  }

  .section-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
  }

  .section-header i {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--primary), var(--primary-lighter));
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 17px;
  }

  [data-theme="dark"] .section-header i { color: var(--bg-page); }

  .section-title {
    font-size: 19px;
    font-weight: 800;
    color: var(--text-main);
  }

  .buttons-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 16px;
  }

  .action-btn {
    background: var(--bg-card);
    border: 2px solid var(--border);
    border-radius: 18px;
    padding: 24px 18px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    transition: all 0.3s ease;
    text-decoration: none;
    color: var(--text-main);
    min-height: 140px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 4px 14px var(--shadow);
    font-family: 'Cairo', sans-serif;
    text-align: center;
  }

  .action-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-lighter) 100%);
    opacity: 0;
    transition: opacity 0.3s ease;
    z-index: 0;
  }

  .action-btn:hover {
    transform: translateY(-6px);
    border-color: var(--accent);
    box-shadow: 0 12px 30px var(--shadow);
  }

  .action-btn:hover::before { opacity: 0.08; }

  .action-btn:active { transform: translateY(-2px) scale(0.98); }

  .action-btn-icon {
    width: 62px;
    height: 62px;
    border-radius: 16px;
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-lighter) 100%);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    position: relative;
    z-index: 1;
    flex-shrink: 0;
    overflow: hidden;
    box-shadow: 0 8px 20px rgba(11, 61, 46, 0.25);
    transition: transform 0.3s ease;
  }

  [data-theme="dark"] .action-btn-icon {
    color: var(--bg-page);
    box-shadow: 0 8px 20px rgba(201, 169, 97, 0.25);
  }

  .action-btn:hover .action-btn-icon {
    transform: scale(1.08) rotate(-4deg);
  }

  .action-btn-icon img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 16px;
  }

  .action-btn-label {
    font-size: 15.5px;
    font-weight: 800;
    color: var(--text-main);
    position: relative;
    z-index: 1;
    line-height: 1.4;
    word-break: break-word;
  }

  .action-btn.external::after {
    content: '\f08e';
    font-family: 'Font Awesome 6 Free';
    font-weight: 900;
    position: absolute;
    top: 12px;
    left: 12px;
    font-size: 11px;
    color: var(--accent);
    opacity: 0.7;
    z-index: 2;
  }

  .empty-state {
    background: var(--bg-card);
    border: 2px dashed var(--border);
    border-radius: 20px;
    padding: 60px 24px;
    text-align: center;
    color: var(--text-sub);
  }

  .empty-state i {
    font-size: 48px;
    color: var(--accent);
    margin-bottom: 16px;
    display: block;
    opacity: 0.6;
  }

  .empty-state h3 {
    font-size: 17px;
    font-weight: 800;
    color: var(--text-main);
    margin-bottom: 8px;
  }

  .empty-state p { font-size: 13.5px; font-weight: 500; }

  /* ============================================================
     التذييل
     ============================================================ */
  .page-footer {
    text-align: center;
    padding: 24px 20px 40px;
    font-size: 12.5px;
    color: var(--text-sub);
    font-weight: 500;
    line-height: 1.8;
    border-top: 1px solid var(--border);
    margin-top: 40px;
  }

  .page-footer strong {
    color: var(--primary);
    font-weight: 800;
  }

  [data-theme="dark"] .page-footer strong { color: var(--accent); }

  /* ============================================================
     Toast
     ============================================================ */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(120px);
    background: var(--bg-card);
    color: var(--text-main);
    padding: 14px 24px;
    border-radius: 14px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
    border: 1px solid var(--border);
    font-weight: 700;
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    z-index: 99999;
    transition: transform 0.4s ease, opacity 0.3s ease;
    opacity: 0;
    max-width: calc(100vw - 32px);
  }

  .toast.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }

  .toast.success { border-color: var(--success); }
  .toast.success i { color: var(--success); }
  .toast.error { border-color: var(--error); }
  .toast.error i { color: var(--error); }

  /* ============================================================
     Loading skeletons
     ============================================================ */
  .loading-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 16px;
  }

  .skeleton-btn {
    background: var(--bg-card);
    border: 2px solid var(--border);
    border-radius: 18px;
    padding: 24px 18px;
    min-height: 140px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    animation: pulse 1.5s ease-in-out infinite;
  }

  .skeleton-icon {
    width: 62px;
    height: 62px;
    border-radius: 16px;
    background: var(--border);
    opacity: 0.5;
  }

  .skeleton-label {
    width: 100px;
    height: 18px;
    border-radius: 8px;
    background: var(--border);
    opacity: 0.5;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.6; }
  }

  /* ============================================================
     قائمة الموبايل الجانبية (Drawer)
     ============================================================ */
  .drawer-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(4px);
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.3s ease, visibility 0.3s ease;
    z-index: 998;
  }

  .drawer-overlay.show {
    opacity: 1;
    visibility: visible;
  }

  .drawer {
    position: fixed;
    top: 0;
    right: 0;
    width: 88%;
    max-width: 340px;
    height: 100vh;
    height: 100dvh;
    background: var(--bg-card);
    box-shadow: -10px 0 40px rgba(0, 0, 0, 0.3);
    transform: translateX(105%);
    transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: 999;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border-left: 1px solid var(--border);
  }

  .drawer.open {
    transform: translateX(0);
  }

  .drawer-header {
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
    padding: 22px 20px;
    color: #fff;
    position: relative;
    overflow: hidden;
    flex-shrink: 0;
  }

  .drawer-header::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image: radial-gradient(circle at 80% 20%, rgba(201, 169, 97, 0.2) 0%, transparent 50%);
    pointer-events: none;
  }

  .drawer-header-content {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .drawer-logo {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    object-fit: contain;
    background: rgba(255,255,255,0.1);
    padding: 4px;
    border: 2px solid var(--accent);
    flex-shrink: 0;
  }

  .drawer-brand {
    flex: 1;
    min-width: 0;
  }

  .drawer-brand-name {
    font-size: 18px;
    font-weight: 900;
    letter-spacing: 1px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .drawer-brand-name .divider {
    color: var(--accent);
    font-weight: 300;
  }

  .drawer-brand-sub {
    font-size: 12px;
    color: rgba(255, 255, 255, 0.75);
    font-weight: 500;
    margin-top: 2px;
  }

  .drawer-close {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.15);
    border: none;
    color: #fff;
    font-size: 15px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    flex-shrink: 0;
  }

  .drawer-close:hover {
    background: rgba(255, 255, 255, 0.3);
    transform: rotate(90deg);
  }

  .drawer-content {
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px;
    -webkit-overflow-scrolling: touch;
  }

  .drawer-section {
    margin-bottom: 22px;
  }

  .drawer-section:last-child {
    margin-bottom: 0;
  }

  .drawer-section-title {
    font-size: 11.5px;
    font-weight: 800;
    color: var(--text-sub);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 12px;
    padding-right: 4px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .drawer-section-title i {
    color: var(--accent);
    font-size: 12px;
  }

  .drawer-btn {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 16px;
    background: var(--bg-input);
    border: 2px solid var(--border);
    border-radius: 14px;
    margin-bottom: 10px;
    text-decoration: none;
    color: var(--text-main);
    font-family: 'Cairo', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.25s ease;
    width: 100%;
    text-align: right;
    position: relative;
  }

  .drawer-btn:hover,
  .drawer-btn:active {
    background: var(--bg-card);
    border-color: var(--accent);
    transform: translateX(-4px);
  }

  .drawer-btn-icon {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--primary), var(--primary-lighter));
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
    overflow: hidden;
    box-shadow: 0 4px 12px rgba(11, 61, 46, 0.2);
  }

  [data-theme="dark"] .drawer-btn-icon {
    color: var(--bg-page);
  }

  .drawer-btn-icon img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 12px;
  }

  .drawer-btn-label {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .drawer-btn.external::after {
    content: '\f08e';
    font-family: 'Font Awesome 6 Free';
    font-weight: 900;
    font-size: 11px;
    color: var(--accent);
    opacity: 0.7;
    flex-shrink: 0;
  }

  .drawer-btn.logout-btn {
    color: var(--error);
    border-color: rgba(192, 57, 43, 0.3);
    background: rgba(192, 57, 43, 0.05);
  }

  .drawer-btn.logout-btn .drawer-btn-icon {
    background: linear-gradient(135deg, #C0392B, #E74C3C);
  }

  .drawer-btn.logout-btn:hover {
    background: var(--error);
    color: #fff;
    border-color: var(--error);
  }

  .drawer-show-more {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 13px 16px;
    background: var(--bg-input);
    border: 2px dashed var(--border);
    border-radius: 14px;
    color: var(--primary);
    font-family: 'Cairo', sans-serif;
    font-size: 13.5px;
    font-weight: 800;
    cursor: pointer;
    transition: all 0.25s ease;
    width: 100%;
    margin-top: 4px;
  }

  [data-theme="dark"] .drawer-show-more {
    color: var(--accent);
  }

  .drawer-show-more:hover {
    background: var(--bg-card);
    border-color: var(--accent);
    border-style: solid;
  }

  .drawer-show-more i {
    transition: transform 0.3s ease;
  }

  .drawer-show-more.expanded i {
    transform: rotate(180deg);
  }

  .drawer-empty {
    padding: 30px 20px;
    text-align: center;
    color: var(--text-sub);
    font-size: 13px;
    font-weight: 600;
  }

  .drawer-empty i {
    font-size: 32px;
    color: var(--accent);
    opacity: 0.5;
    display: block;
    margin-bottom: 10px;
  }

  /* ============================================================
     Responsive
     ============================================================ */

  @media (max-width: 900px) {
    .topbar-inner { padding: 12px 16px; gap: 10px; }
    .topbar-logo { width: 40px; height: 40px; }
    .topbar-title { font-size: 17px; }
    .topbar-title .en { font-size: 13px; letter-spacing: 1.5px; }
    .icon-btn { width: 38px; height: 38px; font-size: 15px; }

    .welcome-banner { margin-top: 20px; padding: 0 16px; }
    .welcome-card { padding: 22px 20px; border-radius: 18px; }
    .welcome-title { font-size: 20px; }
    .welcome-subtitle { font-size: 13px; }
    .welcome-icon { width: 60px; height: 60px; font-size: 26px; }

    .buttons-section { padding: 0 16px; margin-top: 24px; }
    .section-title { font-size: 17px; }
    .section-header i { width: 36px; height: 36px; font-size: 15px; }

    .buttons-grid,
    .loading-grid {
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 12px;
    }

    .action-btn {
      padding: 20px 14px;
      min-height: 120px;
      gap: 12px;
      border-radius: 16px;
    }

    .action-btn-icon { width: 52px; height: 52px; font-size: 22px; border-radius: 14px; }
    .action-btn-icon img { border-radius: 14px; }
    .action-btn-label { font-size: 14px; }

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { 
  getFirestore, doc, onSnapshot 
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAmkCOrSaklhUiDdDfZCpSDQNmMYP-Gdw0",
  authDomain: "qanon-c716d.firebaseapp.com",
  projectId: "qanon-c716d",
  storageBucket: "qanon-c716d.firebasestorage.app",
  messagingSenderId: "757756130875",
  appId: "1:757756130875:web:63c53534c6843e2a29ce1e",
  measurementId: "G-8FZGTC779Y"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const $ = (id) => document.getElementById(id);

// ============================================================
// 🔒 الحماية
// ============================================================
const loggedIn = sessionStorage.getItem('meezan_logged_in') === 'true';
if (!loggedIn) {
  window.location.replace('login.html');
}

history.pushState(null, '', location.href);
window.addEventListener('popstate', () => {
  if (sessionStorage.getItem('meezan_logged_in') === 'true') {
    history.pushState(null, '', location.href);
  } else {
    window.location.replace('login.html');
  }
});

// ============================================================
// 🧹 دالة التنظيف
// ============================================================
function cleanInput(value) {
  if (typeof value !== 'string') return '';
  return value
    .replace(/[\u200B-\u200D\uFEFF]/g, '')
    .replace(/[\u00A0\u1680\u2000-\u200A\u2028\u2029\u202F\u205F\u3000]/g, ' ')
    .replace(/^\s+|\s+$/g, '')
    .trim();
}

// ============================================================
// 📅 حقوق النشر
// ============================================================
function buildCopyright(data) {
  const year = new Date().getFullYear();
  const nameAr = data.siteNameAr || 'ميزان';
  const nameEn = data.siteNameEn || 'MEEZAN';

  if (data.copyright) {
    const customText = data.copyright
      .replace(/©\s*\d{4}/g, `© ${year}`)
      .replace(/\b20\d{2}\b/g, year);
    return customText;
  }

  return `<strong>${nameAr} | ${nameEn}</strong> © ${year}`;
}

// ============================================================
// 🌙 الوضع الليلي / النهاري
// ============================================================
const savedTheme = localStorage.getItem('meezan_theme') || 'light';
document.documentElement.setAttribute('data-theme', savedTheme);
updateThemeIcon(savedTheme);
updateDrawerTheme(savedTheme);

$('themeToggle').addEventListener('click', toggleTheme);

function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme');
  const next = current === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('meezan_theme', next);
  updateThemeIcon(next);
  updateDrawerTheme(next);
}

function updateThemeIcon(theme) {
  $('themeIcon').className = theme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
}

function updateDrawerTheme(theme) {
  const icon = $('drawerThemeIcon');
  const text = $('drawerThemeText');
  if (!icon || !text) return;
  if (theme === 'dark') {
    icon.className = 'fas fa-sun';
    text.textContent = 'الوضع النهاري';
  } else {
    icon.className = 'fas fa-moon';
    text.textContent = 'الوضع الليلي';
  }
}

// ============================================================
// 📦 الكاش
// ============================================================
const CACHE_SETTINGS = 'meezan_settings_cache';
const CACHE_BUTTONS = 'meezan_buttons_cache';

function saveCache(key, data) {
  try {
    localStorage.setItem(key, JSON.stringify({ ...data, _cachedAt: Date.now() }));
  } catch (e) {}
}

function loadCache(key) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}

// ============================================================
// 🎨 تطبيق الإعدادات
// ============================================================
function applySettings(data) {
  if (!data) return;

  if (data.logoUrl) {
    const logo = $('topbarLogo');
    if (logo.src !== data.logoUrl) logo.src = data.logoUrl;
    const drawerLogo = $('drawerLogo');
    if (drawerLogo && drawerLogo.src !== data.logoUrl) drawerLogo.src = data.logoUrl;
    const iconLink = document.querySelector('link[rel="icon"]');
    if (iconLink && iconLink.href !== data.logoUrl) iconLink.href = data.logoUrl;
  }

  if (data.siteNameAr) {
    $('topbarNameAr').textContent = data.siteNameAr;
    const drawerNameAr = $('drawerNameAr');
    if (drawerNameAr) drawerNameAr.textContent = data.siteNameAr;
  }
  if (data.siteNameEn) {
    $('topbarNameEn').textContent = data.siteNameEn;
    const drawerNameEn = $('drawerNameEn');
    if (drawerNameEn) drawerNameEn.textContent = data.siteNameEn;
  }
  if (data.tagline) {
    const drawerSub = $('drawerSubtitle');
    if (drawerSub) drawerSub.textContent = data.tagline;
  }

  const nameAr = data.siteNameAr || 'ميزان';
  const nameEn = data.siteNameEn || 'MEEZAN';
  const newTitle = `${nameAr} | ${nameEn} - الرئيسية`;
  if (document.title !== newTitle) document.title = newTitle;

  if (data.welcomeMessage) $('welcomeSubtitle').textContent = data.welcomeMessage;

  $('footerCopyright').innerHTML = buildCopyright(data);

  applyColors(data);
}

function applyColors(data) {
  const currentTheme = document.documentElement.getAttribute('data-theme') || 'light';
  const rootStyle = document.documentElement.style;

  rootStyle.removeProperty('--primary');
  rootStyle.removeProperty('--accent');

  if (currentTheme === 'light' && data.lightColorsEnabled === true) {
    if (data.lightPrimary && /^#[0-9A-Fa-f]{6}$/.test(data.lightPrimary)) {
      rootStyle.setProperty('--primary', data.lightPrimary);
    }
    if (data.lightAccent && /^#[0-9A-Fa-f]{6}$/.test(data.lightAccent)) {
      rootStyle.setProperty('--accent', data.lightAccent);
    }
  } else if (currentTheme === 'dark' && data.darkColorsEnabled === true) {
    if (data.darkPrimary && /^#[0-9A-Fa-f]{6}$/.test(data.darkPrimary)) {
      rootStyle.setProperty('--primary', data.darkPrimary);
    }
    if (data.darkAccent && /^#[0-9A-Fa-f]{6}$/.test(data.darkAccent)) {
      rootStyle.setProperty('--accent', data.darkAccent);
    }
  }
}

// ============================================================
// 🔘 عرض الأزرار في الشبكة الرئيسية
// ============================================================
let currentButtonsCache = [];

function renderButtons(buttons) {
  currentButtonsCache = buttons || [];
  const grid = $('buttonsGrid');
  const loading = $('loadingGrid');
  const empty = $('emptyState');

  loading.style.display = 'none';

  if (!buttons || !Array.isArray(buttons) || buttons.length === 0) {
    grid.style.display = 'none';
    empty.style.display = 'block';
    renderDrawerButtons([]);
    return;
  }

  const visibleButtons = buttons
    .filter(b => b && b.visible !== false && b.label)
    .sort((a, b) => (a.order || 0) - (b.order || 0));

  if (visibleButtons.length === 0) {
    grid.style.display = 'none';
    empty.style.display = 'block';
    renderDrawerButtons([]);
    return;
  }

  empty.style.display = 'none';
  grid.style.display = 'grid';
  grid.innerHTML = '';

  visibleButtons.forEach(btn => {
    const el = createButtonElement(btn);
    grid.appendChild(el);
  });

  renderDrawerButtons(visibleButtons);
}

function createButtonElement(btn) {
  const isExternal = btn.url && /^https?:\/\//i.test(btn.url);
  const el = document.createElement('a');
  el.className = 'action-btn' + (isExternal ? ' external' : '');

  if (btn.url) {
    el.href = btn.url;
    if (isExternal) {
      el.target = '_blank';
      el.rel = 'noopener noreferrer';
    }
  } else {
    el.href = 'javascript:void(0)';
    el.style.cursor = 'default';
    el.addEventListener('click', (e) => e.preventDefault());
  }

  const iconWrap = document.createElement('div');
  iconWrap.className = 'action-btn-icon';

  const icon = btn.icon || {};
  const iconType = icon.type || 'fontawesome';
  const iconValue = icon.value || 'fa-circle';

  if (iconType === 'url' || iconType === 'upload') {
    const img = document.createElement('img');
    img.src = iconValue;
    img.alt = btn.label;
    img.loading = 'lazy';
    img.onerror = () => {
      iconWrap.innerHTML = '<i class="fas fa-circle"></i>';
    };
    iconWrap.appendChild(img);
  } else {
    const i = document.createElement('i');
    const faClass = iconValue.startsWith('fa-') ? iconValue : `fa-${iconValue}`;
    i.className = `fas ${faClass}`;
    iconWrap.appendChild(i);
  }

  el.appendChild(iconWrap);

  const label = document.createElement('div');
  label.className = 'action-btn-label';
  label.textContent = btn.label;
  el.appendChild(label);

  return el;
}

// ============================================================
// 📱 قائمة الموبايل
// ============================================================
const MOBILE_BUTTONS_LIMIT = 6;
let drawerExpanded = false;

const drawer = $('drawer');
const drawerOverlay = $('drawerOverlay');
const mobileMenuBtn = $('mobileMenuBtn');
const drawerClose = $('drawerClose');
const drawerButtons = $('drawerButtons');
const drawerThemeBtn = $('drawerThemeBtn');
const drawerLogoutBtn = $('drawerLogoutBtn');

mobileMenuBtn?.addEventListener('click', () => {
  drawer.classList.add('open');
  drawerOverlay.classList.add('show');
  document.body.style.overflow = 'hidden';
});

function closeDrawer() {
  drawer.classList.remove('open');
  drawerOverlay.classList.remove('show');
  document.body.style.overflow = '';
}

drawerClose?.addEventListener('click', closeDrawer);
drawerOverlay?.addEventListener('click', closeDrawer);

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && drawer.classList.contains('open')) {
    closeDrawer();
  }
});

drawerThemeBtn?.addEventListener('click', toggleTheme);

drawerLogoutBtn?.addEventListener('click', () => {
  closeDrawer();
  setTimeout(() => {
    if (confirm('هل تريد تسجيل الخروج؟')) {
      sessionStorage.removeItem('meezan_logged_in');
      sessionStorage.removeItem('meezan_username');
      showToast('تم تسجيل الخروج...', 'success');
      setTimeout(() => {
        window.location.replace('login.html');
      }, 500);
    }
  }, 300);
});

function renderDrawerButtons(buttons) {
  if (!drawerButtons) return;

  drawerButtons.innerHTML = '';

  const visibleButtons = (buttons || [])
    .filter(b => b && b.visible !== false && b.label)
    .sort((a, b) => (a.order || 0) - (b.order || 0));

  if (!visibleButtons.length) {
    drawerButtons.innerHTML = `
      <div class="drawer-empty">
        <i class="fas fa-inbox"></i>
        <span>لا توجد أزرار</span>
      </div>
    `;
    return;
  }

  const limit = drawerExpanded ? visibleButtons.length : MOBILE_BUTTONS_LIMIT;
  const toShow = visibleButtons.slice(0, limit);
  const remaining = visibleButtons.length - MOBILE_BUTTONS_LIMIT;

  toShow.forEach(btn => {
    const isExternal = btn.url && /^https?:\/\//i.test(btn.url);
    const el = document.createElement('a');
    el.className = 'drawer-btn' + (isExternal ? ' external ' : '') + '';
    el.href = btn.url || 'javascript:void(0)';
    if (isExternal) {
      el.target = '_blank';
      el.rel = 'noopener noreferrer';
    }
    if (!btn.url) {
      el.addEventListener('click', (e) => e.preventDefault());
    }

    const iconWrap = document.createElement('span');
    iconWrap.className = 'drawer-btn-icon';
    const icon = btn.icon || { type: 'fontawesome', value: 'fa-circle' };
    if (icon.type === 'url' || icon.type === 'upload') {
      iconWrap.innerHTML = `<img src="${icon.value}" alt="${btn.label}" loading="lazy" onerror="this.parentNode.innerHTML='<i class=\\'fas fa-circle\\'></i>'">`;
    } else {
      iconWrap.innerHTML = `<i class="fas ${icon.value}"></i>`;
    }

    const label = document.createElement('span');
    label.className = 'drawer-btn-label';
    label.textContent = btn.label;

    el.appendChild(iconWrap);
    el.appendChild(label);
    drawerButtons.appendChild(el);
  });

  if (remaining > 0 || drawerExpanded) {
    const showMoreBtn = document.createElement('button');
    showMoreBtn.type = 'button';
    showMoreBtn.className = 'drawer-show-more' + (drawerExpanded ? ' expanded' : '');

    if (drawerExpanded) {
      showMoreBtn.innerHTML = `<i class="fas fa-chevron-up"></i> عرض أقل`;
    } else {
      showMoreBtn.innerHTML = `<i class="fas fa-chevron-down"></i> عرض المزيد (${remaining})`;
    }

    showMoreBtn.addEventListener('click', () => {
      drawerExpanded = !drawerExpanded;
      renderDrawerButtons(currentButtonsCache);
    });

    drawerButtons.appendChild(showMoreBtn);
  }
}

// ============================================================
// 📡 Real-time: الإعدادات
// ============================================================
let currentSettings = null;

const cachedSettings = loadCache(CACHE_SETTINGS);
if (cachedSettings) {
  currentSettings = cachedSettings;
  applySettings(cachedSettings);
}

requestAnimationFrame(() => document.body.classList.add('ready'));

onSnapshot(doc(db, 'settings', 'login'), (snap) => {
  if (!snap.exists()) return;
  const data = snap.data();
  currentSettings = data;
  applySettings(data);
  saveCache(CACHE_SETTINGS, data);
}, (err) => {
  console.log('settings real-time error:', err.message);
});

new MutationObserver(() => {
  if (currentSettings) applyColors(currentSettings);
}).observe(document.documentElement, {
  attributes: true,
  attributeFilter: ['data-theme']
});

// ============================================================
// 📡 Real-time: الأزرار
// ============================================================
const cachedButtons = loadCache(CACHE_BUTTONS);
if (cachedButtons && Array.isArray(cachedButtons.items)) {
  renderButtons(cachedButtons.items);
}

onSnapshot(doc(db, 'settings', 'buttons'), (snap) => {
  if (!snap.exists()) {
    renderButtons([]);
    return;
  }
  const data = snap.data();
  const items = data.items || [];
  renderButtons(items);
  saveCache(CACHE_BUTTONS, { items });
}, (err) => {
  console.log('buttons real-time error:', err.message);
  const cachedB = loadCache(CACHE_BUTTONS);
  if (cachedB && Array.isArray(cachedB.items)) {
    renderButtons(cachedB.items);
  }
});

// ============================================================
// 👤 اسم المستخدم
// ============================================================
const savedUsername = cleanInput(sessionStorage.getItem('meezan_username') || 'admin');
$('welcomeUsername').textContent = savedUsername;

// ============================================================
// 🚪 تسجيل الخروج
// ============================================================
$('logoutBtn').addEventListener('click', () => {
  if (!confirm('هل تريد تسجيل الخروج؟')) return;
  sessionStorage.removeItem('meezan_logged_in');
  sessionStorage.removeItem('meezan_username');
  showToast('تم تسجيل الخروج...', 'success');
  setTimeout(() => {
    window.location.replace('login.html');
  }, 500);
});

// ============================================================
// 🔔 Toast
// ============================================================
let toastTimeout;
function showToast(text, type = 'success') {
  const toast = $('toast');
  const icon = $('toastIcon');
  $('toastText').textContent = text;
  toast.className = 'toast show ' + type;
  icon.className = type === 'error' ? 'fas fa-times-circle' : 'fas fa-check-circle';
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => toast.classList.remove('show'), 2500);
}

// ============================================================
// ⏱️ تحديث السنة كل ساعة
// ============================================================
setInterval(() => {
  if (currentSettings) {
    $('footerCopyright').innerHTML = buildCopyright(currentSettings);
  }
}, 3600000);

// ============================================================
// 🛡️ حماية إضافية
// ============================================================
window.addEventListener('pageshow', (e) => {
  if (e.persisted && sessionStorage.getItem('meezan_logged_in') !== 'true') {
    window.location.replace('login.html');
  }
});

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>

</body>
</html>
